[project]
name = "miithii-voice-rtc"
version = "0.1.0"
description = "Realtime WebRTC voice runtime for Miithii"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiohttp>=3.13,<4",
  "pipecat-ai[runner,silero,webrtc]==1.10.0",
]

[project.optional-dependencies]
modal = [
  "fastapi>=0.118,<1",
  "modal>=1,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
