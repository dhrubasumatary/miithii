name: Deploy Miithii Brain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miithii-brain-production
  cancel-in-progress: false

env:
  CI: true

jobs:
  verify:
    name: Verify brain release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API Worker dependencies
        run: npm ci --prefix workers/api

      - name: Verify language contracts
        run: |
          pnpm --filter @miithii/language-core test
          pnpm --filter @miithii/language-core check:voice-contracts

      - name: Test API Worker
        run: npm --prefix workers/api test

      - name: Validate API Worker bundle
        run: npm --prefix workers/api run build

  deploy:
    name: Deploy Miithii brain
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.miithii.in
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API Worker dependencies
        run: npm ci --prefix workers/api

      - name: Deploy API Worker
        run: pnpm dlx wrangler@4.129.1 deploy --config workers/api/wrangler.jsonc --minify

      - name: Verify production brain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /tmp/api-health.json https://api.miithii.in/health
          grep -q '"status":"ok"' /tmp/api-health.json
