name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_canary:
        description: Build the standalone Android Voice canary
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Verify Miithii Voice
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API Worker dependencies
        run: npm ci --prefix workers/api

      - name: Install uv
        run: python -m pip install uv

      - name: Install RTC dependencies
        run: uv sync --directory services/voice-rtc --frozen

      - name: Typecheck Android app and language core
        run: pnpm typecheck

      - name: Validate Expo project
        run: pnpm --dir apps/mobile exec expo-doctor

      - name: Validate Android native configuration
        run: pnpm --dir apps/mobile prebuild:android --clean

      - name: Build Android debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: miithii-android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Android Voice canary APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_canary
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_MIITHII_API_URL: https://api.miithii.in
          EXPO_PUBLIC_USE_VOICE_SESSION: 'true'
          EXPO_PUBLIC_VOICE_TRANSPORT: cloudflare-sfu
          EXPO_PUBLIC_PIPECAT_START_URL: https://dhrubasumatary--miithii-voice-connect-app.modal.run/sfu/start
        run: ./gradlew assembleRelease

      - name: Upload Android Voice canary APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_canary
        uses: actions/upload-artifact@v4
        with:
          name: miithii-android-voice-canary-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Test language policy
        run: |
          pnpm --filter @miithii/language-core test
          pnpm --filter @miithii/language-core check:voice-contracts

      - name: Validate realtime runtime
        run: |
          uv run --directory services/voice-rtc ruff check .
          uv run --directory services/voice-rtc python -m unittest discover tests

      - name: Test API Worker
        run: npm --prefix workers/api test

      - name: Validate API Worker bundle
        run: npm --prefix workers/api run build
