name: Deploy Miithii Voice Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miithii-voice-runtime-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify realtime runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv

      - name: Install runtime dependencies
        run: uv sync --directory services/voice-rtc --extra modal --frozen

      - name: Validate runtime
        run: |
          uv run --directory services/voice-rtc ruff check .
          uv run --directory services/voice-rtc python -m unittest discover tests

  deploy:
    name: Deploy Modal voice runtime
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: voice-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      VOICE_RTC_HEALTH_URL: ${{ vars.VOICE_RTC_HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv

      - name: Install deployment dependencies
        run: uv sync --directory services/voice-rtc --extra modal --frozen

      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID}"
          test -n "${MODAL_TOKEN_SECRET}"
          test -n "${VOICE_RTC_HEALTH_URL}"

      - name: Deploy voice runtime
        working-directory: services/voice-rtc
        run: uv run --extra modal modal deploy modal_app.py

      - name: Verify deployed health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${VOICE_RTC_HEALTH_URL}" | tee /tmp/voice-health.json
          grep -q '"status":"ok"' /tmp/voice-health.json
          grep -q '"transport":"smallwebrtc"' /tmp/voice-health.json
