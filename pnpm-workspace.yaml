packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@clerk/shared': true
overrides:
  # Several packages (e.g. @assistant-ui/ai-sdk) declare a loose `ai` range.
  # Without an override pnpm can install a second `ai` copy, which makes
  # AssistantChatTransport's generic UIMessage type a structurally distinct
  # (and incompatible) type from the app's own `ai` import.
  ai: 7.0.94
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.76'
  - '@ai-sdk/provider-utils@5.0.37'
  - '@ai-sdk/provider@4.0.11'
  - ai@7.0.94
